[project]
name = "iflow-mcp-zippland-weather"
version = "0.1.0"
description = "Provides global weather forecasts and current weather conditions"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.scripts]
weather-mcp-server = "weather_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
